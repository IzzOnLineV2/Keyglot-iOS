name: AITranslateKeyboard

options:
  bundleIdPrefix: it.izzonline
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # IzzOnLine di Stefania Izzo Apple Developer Team ID (migrated from SmartApiBox's 32BK2Y9JL3).
    DEVELOPMENT_TEAM: "WF6Z643R96"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"

targets:

  AITranslateKeyboard:
    type: application
    platform: iOS
    sources:
      - path: AITranslateKeyboard
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.izzonline.keyglot
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_ENTITLEMENTS: AITranslateKeyboard/AITranslateKeyboard.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Keyglot
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: AITranslateKeyboardExtension
        embed: true

  AITranslateKeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: KeyboardExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.izzonline.keyglot.keyboard
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: KeyboardExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: KeyboardExtension/KeyboardExtension.entitlements

schemes:
  AITranslateKeyboard:
    build:
      targets:
        AITranslateKeyboard: all
        AITranslateKeyboardExtension: all
    run:
      config: Debug
    archive:
      config: Release
